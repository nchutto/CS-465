<h1>Add Trip</h1>

<form (ngSubmit)="addTrip()">

  <div>
    <label>Trip Code</label>
    <input
      type="text"
      name="code"
      [(ngModel)]="newTrip.code">
  </div>

  <div>
    <label>Trip Name</label>
    <input
      type="text"
      name="name"
      [(ngModel)]="newTrip.name">
  </div>

  <div>
    <label>Length</label>
    <input
      type="text"
      name="length"
      [(ngModel)]="newTrip.length">
  </div>

  <div>
    <label>Start Date</label>
    <input
      type="date"
      name="start"
      [(ngModel)]="newTrip.start">
  </div>

  <div>
    <label>Resort</label>
    <input
      type="text"
      name="resort"
      [(ngModel)]="newTrip.resort">
  </div>

  <div>
    <label>Price Per Person</label>
    <input
      type="text"
      name="perPerson"
      [(ngModel)]="newTrip.perPerson">
  </div>

  <div>
    <label>Image</label>
    <input
      type="text"
      name="image"
      [(ngModel)]="newTrip.image">
  </div>

  <div>
    <label>Description</label>
    <textarea
      rows="4"
      name="description"
      [(ngModel)]="newTrip.description">
    </textarea>
  </div>

  <button type="submit">
    Save Trip
  </button>

</form>
