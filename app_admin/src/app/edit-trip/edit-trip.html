<h1>Edit Trip</h1>

<form (ngSubmit)="updateTrip()">

  <div>
    <label>Trip Code</label>
    <input type="text" name="code" [(ngModel)]="trip.code" readonly>
  </div>

  <div>
    <label>Trip Name</label>
    <input type="text" name="name" [(ngModel)]="trip.name">
  </div>

  <div>
    <label>Length</label>
    <input type="text" name="length" [(ngModel)]="trip.length">
  </div>

  <div>
    <label>Start Date</label>
    <input type="text" name="start" [(ngModel)]="trip.start">
  </div>

  <div>
    <label>Resort</label>
    <input type="text" name="resort" [(ngModel)]="trip.resort">
  </div>

  <div>
    <label>Price Per Person</label>
    <input type="text" name="perPerson" [(ngModel)]="trip.perPerson">
  </div>

  <div>
    <label>Image</label>
    <input type="text" name="image" [(ngModel)]="trip.image">
  </div>

  <div>
    <label>Description</label>
    <textarea rows="4" name="description" [(ngModel)]="trip.description"></textarea>
  </div>

  <button type="submit">Update Trip</button>

</form>
