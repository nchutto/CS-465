<div class="container mt-4">
  <h2>Admin Login</h2>

  <form>
    <div class="mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="credentials.email"
        name="email">
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="credentials.password"
        name="password">
    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="onLogin()">
      Login
    </button>
  </form>
</div>
