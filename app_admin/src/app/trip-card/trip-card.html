<div class="card" style="width: 16rem;">
  <div class="card-header">
    {{ trip.name }}
  </div>

  <img
    src="/assets/images/{{ trip.image }}"
    alt="trip thumbnail"
    class="card-img-top">

  <div class="card-body">
    <p class="card-text" [innerHTML]="trip.description"></p>

    <a [routerLink]="['/edit-trip', trip.code]">
      Edit Trip
    </a>
  </div>
</div>
